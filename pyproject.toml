[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snareglass"
version = "0.1.0"
description = "Local phishing, link and attachment inspector that plugs into Claude (skill + MCP server)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
ai = ["anthropic>=0.40"]
dev = ["pytest>=7"]

[project.scripts]
snareglass = "snareglass.cli:main"
snareglass-mcp = "snareglass.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
